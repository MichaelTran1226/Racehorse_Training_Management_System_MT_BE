services:
  postgres:
    image: postgres:16-alpine
    container_name: equiflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: equiflow
    ports:
      - "5432:5432"
    volumes:
      - equiflow_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d equiflow"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  equiflow_pg_data:
    name: equiflow_pg_data
    external: true
