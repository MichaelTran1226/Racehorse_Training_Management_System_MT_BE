      const [newDay, setNewDay] = useState('Thứ Ba');
      const [newShift, setNewShift] = useState('morning');
      const [newHorseId, setNewHorseId] = useState('bl456');
      const [newJockeyId, setNewJockeyId] = useState('j1');

          return;

          alert(`LỖI TRÙNG NÀI (FR-006): Nài ${conflict.jockeyName} đã có ca tập cho ngựa ${conflict.horseName}!`);
          return;

        const jObj = jockeys.find((j) => j.id === newJockeyId);
        onAddSession({
          id: `sess-${Date.now()}`,
          dayOfWeek: newDay,
          shift: newShift,
          timeSlot: newShift === 'morning' ? '06:00 - 07:15' : '16:00 - 17:15',
          horseId: newHorseId,
          horseName: selHorse.name,
          horseCode: selHorse.code,
          stall: selHorse.stall,
          exerciseTitle: newExercise,
          distanceMeters: newDistance,
          trackType: 'turf',

          jockeyName: jObj.name,
          groomId: 'g1',

          status: 'scheduled',

              {days.map((day) => {
                const daySess = sessions.filter((s) => s.dayOfWeek === day);

                      {morning.map((s) => (

                {conflict && (

            </div>

            <div className="bg-canvas px-6 py-3 border-t border-border flex justify-end">
              <button onClick={onClose} className="px-4 py-1.5 bg-forest text-white rounded text-xs font-bold">
                Đã hiểu & Đóng
              </button>
            </div>
          </div>
        </div>
      );
    }

    // Mount
    ReactDOM.render(<EquiFlowApp />, document.getElementById('root'));
  </script>
</body>
</html>
