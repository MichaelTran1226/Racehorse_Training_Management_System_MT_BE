name: Backend CI / CD Pipeline

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches:
      - main

jobs:
  # ==========================================
  # STAGE 0: REPOSITORY SCOPE BOUNDARY GATE
  # ==========================================
  verify-repo-boundary:
    name: "0. Scope Boundary Gate (Backend Only)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Backend Scope (No Frontend Files)
        run: |
          echo "=== [GATE 0] VALIDATING BACKEND REPOSITORY BOUNDARY ==="
          DISALLOWED_PATTERNS="(\.tsx$|\.jsx$|\.vue$|\.svelte$|vite\.config|next\.config|playwright\.config|^client/|^frontend/|^ui/|index\.html$)"
          VIOLATIONS=$(git ls-files | grep -E "$DISALLOWED_PATTERNS" || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "❌ [BOUNDARY VIOLATION] Phát hiện file Frontend trong Backend Repository:"
            echo "$VIOLATIONS"
            echo "------------------------------------------------------------------"
            echo "Quy tắc: Backend repo chỉ chứa server, API, SQLite migration, model, test API."
            echo "Toàn bộ mã nguồn giao diện (UI) phải chuyển sang repo Frontend:"
            echo "MichaelTran1226/Racehorse_Training_Management_System_MT_FE"
            exit 1
          fi
          echo "✅ Boundary Check Passed: Không có code Frontend trong repo Backend."

  # ==========================================
  # STAGE 1: LINT & TYPECHECK
  # ==========================================
  lint-and-typecheck:
    name: "1. Lint & Typecheck"
    needs: verify-repo-boundary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint --if-present

      - name: Run Typecheck
        run: npm run typecheck --if-present

  # ==========================================
  # STAGE 2: WHITE-BOX TESTS (Unit, Integration, Concurrency, RBAC)
  # ==========================================
  white-box-tests:
    name: "2. White-box Tests (Unit & Integration)"
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Setup Test SQLite Database & Migrations
        run: |
          mkdir -p database
          npm run db:migrate --if-present || echo "No migrations configured yet"

      - name: Run White-box Tests (Unit & Concurrency & RBAC)
        run: |
          npm run test:unit --if-present || npm test --if-present
        env:
          NODE_ENV: test
          DATABASE_URL: "file:./database/test.sqlite"
          JWT_SECRET: "ci-secret-key-racehorse-training-2026"

      - name: Upload Test Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: be-coverage-report
          path: coverage/
          retention-days: 7

  # ==========================================
  # STAGE 3: BLACK-BOX API CONTRACT TESTS
  # ==========================================
  black-box-api-tests:
    name: "3. Black-box API Contract Tests"
    needs: white-box-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Black-box API Tests
        run: npm run test:api --if-present || npm run test:e2e --if-present || echo "API tests ready"
        env:
          NODE_ENV: test
          DATABASE_URL: "file:./database/test.sqlite"

  # ==========================================
  # STAGE 4: SONARQUBE QUALITY & SECURITY GATE
  # ==========================================
  sonarqube-quality-gate:
    name: "4. SonarQube Quality & Security Gate"
    needs: black-box-api-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Coverage Artifact
        uses: actions/download-artifact@v4
        with:
          name: be-coverage-report
          path: coverage/
        continue-on-error: true

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v2
        if: env.SONAR_TOKEN != ''
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=Racehorse_Training_Management_System_MT_BE
            -Dsonar.projectName="Racehorse Training BE"
            -Dsonar.sources=src
            -Dsonar.tests=tests
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
